<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>관용어 표현 그림 퀴즈 🎯</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .quiz-container {
      background: white;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      max-width: 620px;
      width: 100%;
      overflow: hidden;
    }

    /* ── Header ── */
    .header {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      padding: 24px 32px;
      text-align: center;
      color: white;
    }
    .header h1 { font-size: 1.7rem; margin-bottom: 6px; text-shadow: 1px 2px 4px rgba(0,0,0,.2); }
    .header p  { font-size: 0.95rem; opacity: .9; }

    /* ── Progress ── */
    .progress-bar-wrap {
      padding: 16px 32px 0;
    }
    .progress-info {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: #666;
      margin-bottom: 6px;
    }
    .progress-bar {
      height: 10px;
      background: #e9ecef;
      border-radius: 6px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #f093fb, #f5576c);
      border-radius: 6px;
      transition: width .4s ease;
    }

    /* ── Question card ── */
    .question-area {
      padding: 24px 32px 0;
    }
    .question-number {
      font-size: 0.8rem;
      color: #999;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .question-text {
      font-size: 1.15rem;
      font-weight: 700;
      color: #2d3436;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    /* ── Illustration ── */
    .illustration {
      background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
      border-radius: 20px;
      padding: 30px 20px;
      text-align: center;
      margin-bottom: 24px;
      min-height: 220px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* Each unique scene */
    .scene { width: 100%; }

    /* Person figure base */
    .figure {
      position: relative;
      display: inline-block;
      font-size: 1rem;
    }
    .bubble {
      background: white;
      border-radius: 12px;
      padding: 8px 14px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #2d3436;
      box-shadow: 0 2px 8px rgba(0,0,0,.15);
      margin: 8px auto;
      display: inline-block;
    }
    .emoji-big   { font-size: 4.5rem; line-height: 1; display: block; }
    .emoji-mid   { font-size: 3rem;   line-height: 1; display: inline-block; }
    .emoji-small { font-size: 2rem;   line-height: 1; display: inline-block; }
    .row { display: flex; align-items: flex-end; justify-content: center; gap: 12px; margin: 6px 0; }
    .label { font-size: 0.78rem; color: #636e72; margin-top: 4px; display: block; }
    .scene-caption {
      font-size: 1.1rem;
      font-weight: 700;
      color: #2d3436;
      margin-top: 12px;
      background: rgba(255,255,255,.7);
      padding: 6px 18px;
      border-radius: 20px;
    }
    .x-mark { color: #e17055; font-size: 2rem; font-weight: 900; }
    .check  { color: #00b894; font-size: 2rem; font-weight: 900; }
    .arrow  { font-size: 2.5rem; }

    /* ── Options ── */
    .options {
      padding: 0 32px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }
    .option-btn {
      background: #f8f9fa;
      border: 2.5px solid #e9ecef;
      border-radius: 14px;
      padding: 14px 16px;
      font-size: 0.95rem;
      font-weight: 600;
      color: #2d3436;
      cursor: pointer;
      text-align: center;
      transition: all .2s;
      line-height: 1.4;
    }
    .option-btn:hover:not(:disabled) {
      border-color: #f5576c;
      background: #fff5f5;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(245,87,108,.2);
    }
    .option-btn.correct  { background: #d4edda; border-color: #28a745; color: #155724; }
    .option-btn.wrong    { background: #f8d7da; border-color: #dc3545; color: #721c24; }
    .option-btn:disabled { cursor: default; transform: none; }

    /* ── Feedback ── */
    .feedback {
      margin: 0 32px 20px;
      padding: 14px 20px;
      border-radius: 14px;
      font-size: 0.95rem;
      font-weight: 600;
      text-align: center;
      display: none;
    }
    .feedback.show { display: block; }
    .feedback.correct-fb { background: #d4edda; color: #155724; }
    .feedback.wrong-fb   { background: #f8d7da; color: #721c24; }

    /* ── Next button ── */
    .next-btn {
      display: none;
      margin: 0 32px 28px;
      width: calc(100% - 64px);
      padding: 16px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity .2s, transform .2s;
    }
    .next-btn:hover { opacity: .9; transform: translateY(-2px); }
    .next-btn.show  { display: block; }

    /* ── Result screen ── */
    .result-screen {
      display: none;
      padding: 40px 32px;
      text-align: center;
    }
    .result-screen.show { display: block; }
    .result-emoji  { font-size: 6rem; margin-bottom: 16px; }
    .result-title  { font-size: 2rem; font-weight: 800; color: #2d3436; margin-bottom: 8px; }
    .result-score  { font-size: 1.2rem; color: #666; margin-bottom: 24px; }
    .result-grade  {
      display: inline-block;
      background: linear-gradient(135deg, #f093fb, #f5576c);
      color: white;
      padding: 10px 28px;
      border-radius: 30px;
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 28px;
    }
    .review-title { font-size: 1rem; font-weight: 700; color: #2d3436; margin-bottom: 12px; }
    .review-list  { text-align: left; margin-bottom: 28px; }
    .review-item  {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 14px;
      border-radius: 10px;
      margin-bottom: 8px;
      font-size: 0.88rem;
      line-height: 1.5;
    }
    .review-item.ok   { background: #d4edda; color: #155724; }
    .review-item.bad  { background: #f8d7da; color: #721c24; }
    .restart-btn {
      padding: 16px 40px;
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      color: white;
      border: none;
      border-radius: 14px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity .2s;
    }
    .restart-btn:hover { opacity: .9; }
  </style>
</head>
<body>
<div class="quiz-container">

  <!-- Header -->
  <div class="header">
    <h1>🎨 관용어 표현 그림 퀴즈</h1>
    <p>그림을 보고 알맞은 관용어를 고르세요! (초등 6학년)</p>
  </div>

  <!-- Quiz body -->

    <div class="progress-bar-wrap">

      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill" style="width:10%"></div>
      </div>
    </div>

    <div class="question-area">
      <div class="question-number" id="questionNumber">문제 1</div>
      <div class="question-text" id="questionText"></div>
      <div class="illustration" id="illustration"></div>
    </div>

    <div class="options" id="optionsArea"></div>
    <div class="feedback" id="feedback"></div>
    <button class="next-btn" id="nextBtn" onclick="nextQuestion()">다음 문제 →</button>
  </div>

  <!-- Result screen -->
  <div class="result-screen" id="resultScreen">
    <div class="result-emoji" id="resultEmoji"></div>
    <div class="result-title" id="resultTitle"></div>
    <div class="result-score" id="resultScore"></div>
    <div class="result-grade" id="resultGrade"></div>
    <div class="review-title">📋 정답 확인</div>
    <div class="review-list" id="reviewList"></div>
    <button class="restart-btn" onclick="restart()">🔄 다시 도전하기</button>
  </div>

        </div>
        <div class="bubble">"우리 손주는 정말 너무 귀엽구나~ 💕"</div>
        <div class="scene-caption">💕 눈에 넣어도 = 너무 소중!</div>
      </div>`,
    options: ["눈이 높다", "눈에 넣어도 안 아프다", "눈이 빠지다", "눈에 밟히다"],
    answer: 1
  }
];

let current = 0;
let score   = 0;
let answers = [];  // {idiom, correct: bool, chosen, answer}

function shuffle(arr) {
  return arr.slice().sort(() => Math.random() - 0.5);
}

function render() {
  const q = questions[current];
  document.getElementById('questionNumber').textContent = `문제 ${current + 1}`;
  document.getElementById('questionText').textContent   = q.hint;
  document.getElementById('illustration').innerHTML     = q.scene;
  document.getElementById('progressText').textContent   = `${current + 1} / ${questions.length}`;
  document.getElementById('scoreText').textContent      = `점수: ${score}점`;
  document.getElementById('progressFill').style.width   = `${((current + 1) / questions.length) * 100}%`;

  const optArea = document.getElementById('optionsArea');
  optArea.innerHTML = '';

  // Keep correct answer position fixed but shuffle only wrong ones position
  q.options.forEach((opt, idx) => {
    const btn = document.createElement('button');
    btn.className   = 'option-btn';
    btn.textContent = opt;
    btn.onclick     = () => selectAnswer(idx, q.answer, q.meaning);
    optArea.appendChild(btn);
  });

  document.getElementById('feedback').className = 'feedback';
  document.getElementById('feedback').textContent = '';
  document.getElementById('nextBtn').className   = 'next-btn';
}

function selectAnswer(chosen, correct, meaning) {
  const btns = document.querySelectorAll('.option-btn');
  btns.forEach(b => b.disabled = true);

  const fb   = document.getElementById('feedback');
  const q    = questions[current];
  const isOk = chosen === correct;

  btns[correct].classList.add('correct');
  if (!isOk) btns[chosen].classList.add('wrong');

  if (isOk) {
    score++;
    fb.textContent  = `🎉 정답! "${q.idiom}" = ${meaning}`;
    fb.className    = 'feedback show correct-fb';
  } else {
    fb.textContent  = `😅 틀렸어요! 정답은 "${q.idiom}" = ${meaning}`;
    fb.className    = 'feedback show wrong-fb';
  }

  answers.push({ idiom: q.idiom, correct: isOk, chosenText: q.options[chosen], meaning });
  document.getElementById('scoreText').textContent = `점수: ${score}점`;
  document.getElementById('nextBtn').className = 'next-btn show';
}

function nextQuestion() {
  current++;
  if (current >= questions.length) {
    showResult();
  } else {
    render();
  }
}

function showResult() {
  document.getElementById('quizBody').style.display    = 'none';
  const rs = document.getElementById('resultScreen');
  rs.className = 'result-screen show';

  const pct = (score / questions.length) * 100;
  let emoji, title, grade;
  if      (pct === 100) { emoji = '🏆'; title = '완벽해요!';    grade = '관용어 달인 🥇'; }
  else if (pct >= 80)   { emoji = '🎉'; title = '훌륭해요!';    grade = '관용어 고수 🥈'; }
  else if (pct >= 60)   { emoji = '😊'; title = '잘했어요!';    grade = '관용어 견습 🥉'; }
  else if (pct >= 40)   { emoji = '📚'; title = '조금 더 공부!'; grade = '관용어 입문 📖'; }
  else                   { emoji = '💪'; title = '다시 도전!';   grade = '다시 해봐요 🔄'; }

  document.getElementById('resultEmoji').textContent = emoji;
  document.getElementById('resultTitle').textContent = title;
  document.getElementById('resultScore').textContent =
    `${questions.length}문제 중 ${score}문제 정답 (${pct}점)`;
  document.getElementById('resultGrade').textContent = grade;

  const list = document.getElementById('reviewList');
  list.innerHTML = answers.map((a, i) =>
    `<div class="review-item ${a.correct ? 'ok' : 'bad'}">
      <span>${a.correct ? '✅' : '❌'}</span>
      <div>
        <strong>${i+1}. ${a.idiom}</strong><br>
        <span style="font-size:.82rem">${a.meaning}</span>
        ${!a.correct ? `<br><span style="font-size:.8rem">내 답: ${a.chosenText}</span>` : ''}
      </div>
    </div>`
  ).join('');
}

function restart() {
  current = 0; score = 0; answers = [];
  document.getElementById('resultScreen').className = 'result-screen';
  document.getElementById('quizBody').style.display = '';
  render();
}

render();
</script>
</body>
</html>
